<div style="max-width:560px;margin:0 auto">
  <!-- Stepper — all steps done -->
  <mat-stepper [linear]="true" [selectedIndex]="3" style="background:transparent;margin-bottom:24px">
    <mat-step label="Criar" state="done"></mat-step>
    <mat-step label="Checklist" state="done"></mat-step>
    <mat-step label="Fotos" state="done"></mat-step>
    <mat-step label="Relatório" state="edit"></mat-step>
  </mat-stepper>

  <mat-card style="border-radius:8px;text-align:center;padding:32px">
    <mat-icon style="font-size:64px;width:64px;height:64px;color:#2196f3;margin-bottom:8px">picture_as_pdf</mat-icon>
    <h2 style="margin:0 0 4px;font-size:20px;font-weight:700;color:#0d1b2a">Relatório de Inspeção</h2>
    <p style="color:#78909c;font-size:13px;margin:0 0 20px">Gere o PDF com checklist, fotos e análise de defeitos da IA.</p>

    <!-- Stats (shown after generation) -->
    <div *ngIf="downloadUrl"
         style="display:flex;justify-content:center;gap:24px;padding:16px;background:#f8fbff;border-radius:8px;margin-bottom:20px">
      <div style="text-align:center">
        <mat-icon style="color:#2196f3;font-size:24px;width:24px;height:24px">check_circle</mat-icon>
        <div style="font-size:11px;color:#78909c;margin-top:4px">Checklist</div>
      </div>
      <div style="text-align:center">
        <mat-icon style="color:#4caf50;font-size:24px;width:24px;height:24px">photo</mat-icon>
        <div style="font-size:11px;color:#78909c;margin-top:4px">Fotos</div>
      </div>
      <div style="text-align:center">
        <mat-icon style="color:#f44336;font-size:24px;width:24px;height:24px">warning</mat-icon>
        <div style="font-size:11px;color:#78909c;margin-top:4px">Defeitos IA</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto">
      <button mat-raised-button color="primary" (click)="generate()" [disabled]="loading || !!downloadUrl"
              style="padding:12px">
        <mat-spinner diameter="18" *ngIf="loading" style="display:inline-block;margin-right:6px"></mat-spinner>
        <mat-icon *ngIf="!loading && !downloadUrl">auto_awesome</mat-icon>
        <span>{{ loading ? 'Gerando...' : (downloadUrl ? 'Relatório gerado ✓' : 'Gerar Relatório') }}</span>
      </button>

      <button mat-raised-button (click)="download()" *ngIf="downloadUrl"
              style="background:#e8f5e9;color:#2e7d32;padding:12px">
        <mat-icon>download</mat-icon> Download PDF
      </button>

      <button mat-button (click)="goHome()" style="color:#78909c">
        <mat-icon>home</mat-icon> Voltar ao Início
      </button>
    </div>
  </mat-card>
</div>
